# Configuración de GitHub Pages del repositorio público de descargas
# (CastilloStudio/bitacora-descargas). Todo lo que hay en sitio-descargas/ se
# copia allí desde el flujo de release; no se edita en el repo público a mano.
# El flujo añade al final "version: X.Y.Z" —la que se acaba de publicar, que es la de
# Windows— y "version_otros: X.Y.Z", la última empaquetada también para Mac y Linux,
# de donde salen los enlaces de esos dos botones de la portada.
title: Bitácora
description: Gestión de consulta de psicología — descarga y manual de uso

# Dominio propio, fijado por el CNAME de al lado. Hace falta declararlo aquí
# porque de él salen las URL absolutas: las etiquetas Open Graph y el sitemap
# no admiten rutas relativas, y una og:image relativa no la carga nadie.
url: https://bitacora.castillostudio.es
lang: es-ES

# Sin tema: la portada (index.html) y el manual comparten _layouts/base.html.
# El manual, sin cabecera Jekyll propia, entra por _layouts/pagina.html.
defaults:
  - scope:
      path: ""
    values:
      layout: pagina

  # El fichero de verificación de Search Console fuera del sitemap. jekyll-sitemap
  # recorre también los ficheros estáticos y se lleva cualquier .html, así que sin
  # esto le estaríamos pidiendo a Google que indexe el token: una página sin
  # contenido que solo ensucia el informe de cobertura.
  #
  # Tiene que ir aquí y no en el propio fichero: una cabecera YAML lo convertiría
  # en página, pasaría por _layouts/ y Google dejaría de encontrar la línea exacta
  # que compara. Por eso vale un default —Jekyll los aplica también a los estáticos,
  # vía StaticFile#data— y no vale una cabecera.
  - scope:
      path: google37cf596a386f6881.html
    values:
      sitemap: false

# Todos incluidos en el gem github-pages:
#  - optional-front-matter: procesa MANUAL.md aunque no lleve cabecera Jekyll
#  - relative-links: reescribe [x](MANUAL.md) -> MANUAL.html
#  - titles-from-headings: usa el primer "# " como título de la página
#  - sitemap: genera /sitemap.xml, al que apunta robots.txt
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-sitemap

exclude:
  - README.md

version: 0.1.15
